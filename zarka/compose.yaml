services:
  db:
    image: postgres:16-alpine
    container_name: zarka-db
    environment:
      POSTGRES_DB: zarka
      POSTGRES_USER: zarka
      POSTGRES_PASSWORD: zarka123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zarka -d zarka"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zarka-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/zarka
      SPRING_DATASOURCE_USERNAME: zarka
      SPRING_DATASOURCE_PASSWORD: zarka123
      SERVER_PORT: 8080
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zarka-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
